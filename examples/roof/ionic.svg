<svg xmlns="http://www.w3.org/2000/svg" class="plate-svg" viewBox="-2.434 -16.159 16.939 7.232" role="img" aria-label="Vitruvian pediment: corner ornaments h, middle ornament 9h/8, blue corner trial envelope"><metadata id="embater-settings">{&quot;format&quot;:&quot;embater-orders-v1&quot;,&quot;modelNotes&quot;:[&quot;The corner addition retains the nominal column axes.&quot;,&quot;Bases and capitals use each column’s own lower diameter; their tops stay level by adjusting shaft length.&quot;,&quot;The Ionic volute joins prescribed quarter-turn radii with a modern linear interpolation and a chosen fillet.&quot;],&quot;order&quot;:&quot;ionic&quot;,&quot;columns&quot;:4,&quot;spacing&quot;:&quot;eustyle&quot;,&quot;base&quot;:&quot;attic&quot;,&quot;sculptedFrieze&quot;:false,&quot;unitFeet&quot;:2.5,&quot;unitName&quot;:&quot;ordinary lower diameter&quot;,&quot;view&quot;:&quot;roof&quot;,&quot;dimensions&quot;:true,&quot;selectedPart&quot;:null,&quot;trialRatio&quot;:0.65,&quot;trialTarget&quot;:&quot;corner&quot;,&quot;reopenUrl&quot;:&quot;https://antonsoo.github.io/embater/#order=ionic&amp;columns=4&amp;spacing=eustyle&amp;base=attic&amp;feet=2.5&amp;view=roof&amp;trial=0.65&quot;}</metadata><title>Embater: measured roof ornaments</title><desc>Modern schematic reading of Vitruvius III.5.12, Krohn 1912 printed page 74. h is a ninth of the model corona front. Corners h; middle 9h/8. Blue corner trial 0.65h. Palmettes, plinths, grey mounting wedges, corner insets and normal cornice thickness are drawing choices. No historical reconstruction is implied. https://archive.org/details/vitruviidearchit00vitr_1/page/n91/mode/1up . Drawing: Copyright 2026 Anthony Mercer, MIT.</desc><style>
