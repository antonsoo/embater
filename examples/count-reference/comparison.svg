  <title id="measure-title">Same count, two measuring trials</title><desc id="measure-desc">Modern trial, six by 11 columns. Corner-column centres: width 15 D, length 15 D, ratio 1. Pitch and platform margin are chosen, not surveyed. Fixed drawing scale. Held reference: six by 11, width 15 D, length 30 D. Red crosses and dashes identify the held trial.</desc>
  <metadata>Original diagram: Copyright 2026 Anthony Mercer; PolyForm Noncommercial 1.0.0. Companion text: Vitruvius III.4.3. The count comes from the selected comparison. Geometry and measuring endpoints are modern trial assumptions. Trial settings: {"basis":"record","edge":"axes","frontPitch":3,"flankPitch":1.5,"margin":1,"equal":false}; flank columns: 11. {"label":"Priene, Temple of Athena","url":"https://www.perseus.tufts.edu/hopper/artifact?name=Priene%2c+Temple+of+Athena&amp;object=Building","quote":"Hexastyle peripteral temple with eleven columns on the sides","credit":"Perseus Digital Library, Tufts University; retained 2026-10-29","license":"https://creativecommons.org/licenses/by-sa/3.0/us/","status":"Catalogue count not flagged as uncertain"} Held reference: {"trial":{"basis":"record","edge":"axes","frontPitch":3,"flankPitch":3,"margin":1,"equal":true},"flank":11,"premise":"Count only from Priene, Temple of Athena: 6 × 11. No dimensions are taken from this building.","uncertainCount":false,"evidence":{"label":"Priene, Temple of Athena","url":"https://www.perseus.tufts.edu/hopper/artifact?name=Priene%2c+Temple+of+Athena&amp;object=Building","quote":"Hexastyle peripteral temple with eleven columns on the sides","credit":"Perseus Digital Library, Tufts University; retained 2026-10-29","license":"https://creativecommons.org/licenses/by-sa/3.0/us/","status":"Catalogue count not flagged as uncertain"}}</metadata>
